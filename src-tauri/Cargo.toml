[package]
name = "ticket-pilot"
version = "0.1.0"
description = "Seguimiento de tickets de ClickUp: cronómetro, pausas y recordatorios"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ticket_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
log = "0.4"
env_logger = "0.11"

# HTTP con rustls: sin depender de OpenSSL del sistema (binario portable).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
base64 = "0.22"

# SQLite embebido (bundled): no requiere librerías en la máquina del usuario.
rusqlite = { version = "0.32", features = ["bundled"] }

# Correo SMTP gratuito (Gmail / Outlook / corporativo).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }

# Secretos en el llavero del SO (Keychain / Credential Manager / Secret Service).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
